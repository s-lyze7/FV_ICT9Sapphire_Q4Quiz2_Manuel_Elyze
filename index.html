<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<title>Score Analyzer</title>

	<style>
		body {
            font-family: Gill Sans, sans-serif;
            color: black;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            backdrop-filter: blur(2px);
        }

        details {
            background-color: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-radius: 5px;
            color: black;
            border: 2px solid rgba(128, 128, 128, 0.4);
        }

        .btn-custom {
            background-color: #376343;
            border: none;
            color: white;
        }

        input {
            width: 80px;
            margin: 5px auto;
        }
	</style>

</head>
<body>

	<div class="container text-center">
        	<h1 class="mt-3"><strong>Score Analyzer</strong></h1>
        	<br>

            	<details>
                	<summary><strong>Grades</strong></summary>
                	<p>Enter your grades in the following subjects ↓</p>
                	
                	<div class="row justify-content-center">
                        <div class="col-md-auto">
                            <label>English:<br><input type="number" id="eng" class="form-control"></label>
                        </div>
                        <div class="col-md-auto">
                            <label>Math:<br><input type="number" id="math" class="form-control"></label>
                        </div>
                        <div class="col-md-auto">
                            <label>Science:<br><input type="number" id="sci" class="form-control"></label>
                        </div>
                    </div>

                	<button type="button" class="btn btn-custom mt-3" onclick="urgrade()">Get Grade</button>
            	</details>
            	<br>
            	<p>@Elyze Manuel</p>
    </div>

    <script>

 		function urgrade() {
 			let e = Number(document.getElementById('eng').value);
  			let m = Number(document.getElementById('math').value);
  			let s = Number(document.getElementById('sci').value); 	

  			let avg = (e + m + s) / 3;
  			let rndavg = Math.round(avg * 100) / 100;

  			switch (true) {
            	case (avg >= 94 && avg <= 100):
                	alert("Your average is " +  rndavg + " - Excellent");
                	break;

            	case (avg >= 87 && avg < 94):
                	alert("Your average is " + rndavg + " - Above Satisfactory");
                	break;

            	case (avg >= 80 && avg < 87):
                	alert("Your average is " + rndavg + " - Satisfactory");
                	break;

            	case (avg >= 75 && avg < 80):
                	alert("Your average is " + rndavg + " - Needs Improvement");
                	break;

            	case (avg >= 70 && avg < 75):
                	alert("Your average is " + rndavg + " - Poor");
                	break;

            	default:
                	alert("Your average is " + rndavg + " - Invalid range.");
        		}
 	 		}

	</script>

</body>
</html>
